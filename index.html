<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>JeevikaAI - Voice-First Livelihood & Skill Guidance</title>
    <meta name="description" content="Multilingual voice-first livelihood and NSQF-aligned skill roadmap platform designed for first-time digital users in Hindi, Bhojpuri, and English." />
    <meta property="og:title" content="JeevikaAI - Voice-First Livelihood & Skill Guidance" />
    <meta property="og:description" content="Multilingual voice-first livelihood and NSQF-aligned skill roadmap platform designed for first-time digital users in Hindi, Bhojpuri, and English." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#17365D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JeevikaAI" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hind:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <script>
      try {
        if (localStorage.getItem('jeevika_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
        const vp = document.querySelector('meta[name=viewport]');
        if (vp) {
          vp.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
        }
      }
    </script>
  </head>
  <body class="bg-[#FFFFFF] text-[#202B36] min-h-screen font-['Hind',system-ui,sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration notice:', err.message);
          });
        });
      }
    </script>
  </body>
</html>
